<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${appName}">Settings</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"/>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}"/>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="app-shell">
  <div th:replace="fragments/nav :: topbar"></div>
  <div class="app-layout">
    <div th:replace="fragments/nav :: sidebar"></div>
    <main class="content-shell container-fluid">
      <div class="page-card p-4">
        <h1 class="h4 mb-3">Settings</h1>
        <div class="row g-3">
          <div class="col-12 col-lg-6"><div class="metric-card"><div class="text-muted">Theme</div><div class="metric-value fs-4">Light / Dark mode supported</div></div></div>
          <div class="col-12 col-lg-6"><div class="metric-card"><div class="text-muted">Brand</div><div class="metric-value fs-4">stripedApe product</div></div></div>
        </div>
      </div>
    </main>
  </div>
  <div th:replace="fragments/nav :: footer"></div>
  <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/js/app.js}"></script>
</body>
</html>
