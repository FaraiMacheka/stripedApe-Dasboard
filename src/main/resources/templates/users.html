<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${appName}">Users</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}"/>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"/>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}"/>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="app-shell">
  <div th:replace="fragments/nav :: topbar"></div>
  <div class="app-layout">
    <div th:replace="fragments/nav :: sidebar"></div>
    <main class="content-shell container-fluid">
      <div class="page-card p-4 mb-4 d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h1 class="h4 mb-1">Users</h1>
          <p class="text-muted mb-0">RBAC accounts for the dashboard.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/users/new}"><i class="bi bi-person-plus me-2"></i>Add user</a>
      </div>
      <div class="table-card">
        <div class="table-responsive">
          <table class="table mb-0 align-middle">
            <thead><tr><th>Username</th><th>Display name</th><th>Roles</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
              <tr th:each="user : ${users}">
                <td th:text="${user.username}">admin</td>
                <td th:text="${user.displayName}">StripedApe Admin</td>
                <td th:text="${user.roles}">[ADMIN]</td>
                <td><span class="badge badge-soft" th:text="${user.enabled ? 'Enabled' : 'Disabled'}">Enabled</span></td>
                <td class="d-flex flex-wrap gap-2">
                  <a class="btn btn-sm btn-outline-secondary" th:href="@{'/users/' + ${user.id} + '/edit'}">Edit</a>
                  <form th:action="@{'/users/' + ${user.id} + '/delete'}" method="post" onsubmit="return confirm('Delete this user?')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                  </form>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(users)}"><td colspan="5" class="text-center text-muted py-4">No users configured.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <div th:replace="fragments/nav :: footer"></div>
  <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/js/app.js}"></script>
</body>
</html>
