<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${appName}">Table rows</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}"/>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"/>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}"/>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="app-shell">
  <div th:replace="fragments/nav :: topbar"></div>
  <div class="app-layout">
    <div th:replace="fragments/nav :: sidebar"></div>
    <main class="content-shell container-fluid">
      <div class="page-card p-4 mb-4">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-3">
          <div>
            <h1 class="h4 mb-1" th:text="${details.schema + '.' + details.tableName}">public.users</h1>
            <p class="text-muted mb-0" th:text="${connection.name}">amayezi</p>
          </div>
          <div class="card-actions">
            <a class="btn btn-primary" th:if="${!details.primaryKeys.isEmpty()}" th:href="@{'/databases/' + ${connection.id} + '/tables/' + ${tableName} + '/new'}"><i class="bi bi-plus-lg me-2"></i>Add row</a>
            <a class="btn btn-outline-secondary" th:href="@{'/databases/' + ${connection.id} + '/tables/' + ${tableName} + '/export'(q=${searchQuery}, sort=${pageData.sortBy}, dir=${pageData.direction})}"><i class="bi bi-download me-2"></i>CSV</a>
            <a class="btn btn-outline-secondary" th:href="@{'/databases/' + ${connection.id} + '/tables'}">Tables</a>
          </div>
        </div>
        <form class="row g-2 align-items-center" method="get" th:action="@{'/databases/' + ${connection.id} + '/tables/' + ${tableName}}">
          <div class="col-12 col-lg-6">
            <input class="form-control" type="search" name="q" th:value="${searchQuery}" placeholder="Search this table" data-live-filter="#rowsTable"/>
          </div>
          <div class="col-12 col-lg-auto">
            <button class="btn btn-outline-primary" type="submit">Filter</button>
          </div>
        </form>
      </div>
      <div class="table-card">
        <div class="table-responsive">
          <table class="table mb-0 align-middle" id="rowsTable">
            <thead>
              <tr>
                <th th:each="column : ${details.columns}">
                  <a class="text-decoration-none" th:href="@{'/databases/' + ${connection.id} + '/tables/' + ${tableName}(q=${searchQuery}, sort=${column.name}, dir=${pageData.direction == 'ASC' ? 'DESC' : 'ASC'})}">
                    <span th:text="${column.name}">id</span>
                    <i class="bi bi-arrow-down-up ms-1 small"></i>
                  </a>
                </th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="row : ${rows}">
                <td th:each="column : ${details.columns}" th:text="${row.values[column.name]}">value</td>
                <td class="d-flex flex-wrap gap-2">
                  <a class="btn btn-sm btn-outline-secondary" th:if="${!#strings.isEmpty(row.rowId)}" th:href="@{'/databases/' + ${connection.id} + '/tables/' + ${tableName} + '/' + ${row.rowId} + '/edit'}">Edit</a>
                  <form th:if="${!#strings.isEmpty(row.rowId)}" th:action="@{'/databases/' + ${connection.id} + '/tables/' + ${tableName} + '/' + ${row.rowId} + '/delete'}" method="post" onsubmit="return confirm('Delete this row?')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                  </form>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(rows)}"><td th:colspan="${details.columns.size() + 1}" class="text-center text-muted py-4">No rows found.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <div th:replace="fragments/nav :: footer"></div>
  <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/js/app.js}"></script>
</body>
</html>
