<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${appName}">Dashboard</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"/>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}"/>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="app-shell">
  <div th:replace="fragments/nav :: topbar"></div>
  <div class="app-layout">
    <div th:replace="fragments/nav :: sidebar"></div>
    <main class="content-shell container-fluid">
      <div class="row g-3 mb-4">
        <div class="col-12 col-md-4"><div class="metric-card"><div class="text-muted">Databases</div><div class="metric-value" th:text="${databaseCount}">4</div><div class="small text-muted">Managed connections</div></div></div>
        <div class="col-12 col-md-4"><div class="metric-card"><div class="text-muted">Active</div><div class="metric-value" th:text="${activeCount}">4</div><div class="small text-muted">Ready for browsing</div></div></div>
        <div class="col-12 col-md-4"><div class="metric-card"><div class="text-muted">Users</div><div class="metric-value" th:text="${userCount}">3</div><div class="small text-muted">RBAC accounts</div></div></div>
      </div>
      <div class="page-card p-4 mb-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <div>
            <h2 class="h4 mb-1">Dashboard</h2>
            <p class="text-muted mb-0">Overview of connected databases and fast actions for CRUD work.</p>
          </div>
          <div class="card-actions">
            <a class="btn btn-primary" th:href="@{/databases}"><i class="bi bi-database-add me-2"></i>Manage databases</a>
            <a class="btn btn-outline-secondary" th:href="@{/users}"><i class="bi bi-people me-2"></i>Manage users</a>
          </div>
        </div>
        <div class="row g-3">
          <div class="col-12 col-lg-6" th:each="db : ${databases}">
            <div class="page-card p-3 h-100">
              <div class="d-flex justify-content-between align-items-start gap-3">
                <div>
                  <div class="d-flex align-items-center gap-2 mb-1"><h3 class="h5 mb-0" th:text="${db.name}">amayezi</h3><span class="badge badge-soft" th:text="${db.active ? 'Active' : 'Inactive'}">Active</span></div>
                  <div class="text-muted small" th:text="${db.jdbcUrl}">jdbc:postgresql://...</div>
                </div>
                <div class="btn-group">
                  <a class="btn btn-sm btn-outline-primary" th:href="@{'/databases/' + ${db.id} + '/tables'}">Open</a>
                  <a class="btn btn-sm btn-outline-secondary" th:href="@{'/databases/' + ${db.id} + '/edit'}">Edit</a>
                </div>
              </div>
              <div class="mt-3 small text-muted" th:text="${db.description ?: 'No description provided'}">No description provided</div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div th:replace="fragments/nav :: footer"></div>
  <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/js/app.js}"></script>
</body>
</html>
